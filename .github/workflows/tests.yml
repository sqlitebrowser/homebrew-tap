name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'Formula/**'

jobs:
  create-comment:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - if: github.event_name == 'pull_request'
        name: Find Comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: "> This will trigger the `brew pr-pull` workflow, which will automatically add the bottle and merge the PR."

      - if: github.event_name == 'pull_request' && steps.fc.outputs.comment-id == ''
        name: Create a comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            > [!WARNING]
            > For Maintainers: When approving a PR, do not merge it directly. Instead add the `pr-pull` label.
            > This will trigger the `brew pr-pull` workflow, which will automatically add the bottle and merge the PR.

  test-bot:
    strategy:
      matrix:
        os: [macos-14, macos-15, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
